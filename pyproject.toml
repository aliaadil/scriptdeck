[project]
name = "kindling"
version = "2.0.0"
description = "Self-hosted scheduled script runner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "pydantic>=2.6",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "croniter>=2.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "coverage>=7.4",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
kindling = "kindling.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindling"]
artifacts = ["src/kindling/data/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=kindling --cov-report=term-missing --cov-fail-under=60"

[[tool.mypy.overrides]]
module = ["kindling.*"]
disallow_untyped_defs = true
ignore_errors = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "S"]
ignore = [
    "B008",     # FastAPI Depends() in default args is required
    "ASYNC240", # pathlib in async is acceptable for our lock pattern
    "S101",     # pytest asserts are idiomatic
    "S608",     # migrations use raw SQL with known table names
    "S202",     # backup.py uses tarfile; member validation is separate
    "N806",     # type names in annotations (e.g. Session)
    "B904",     # acceptable for our error pattern
    "S110",     # acceptable in error paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]