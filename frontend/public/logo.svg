    <g transform="translate(60 94)">
      <g transform="rotate(-26)">
        <rect x="-5.6" y="-74" width="11.2" height="70" rx="5.6" fill="#92400e"/>
        <rect x="-5.6" y="-74" width="3.7" height="70" rx="1.8" fill="#fbbf24" fill-opacity="0.55"/>
      </g>
      <g transform="rotate(0)">
